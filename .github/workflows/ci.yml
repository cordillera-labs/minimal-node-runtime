# Checks a pull request: unit tests, shellcheck, the workflow lint, and the
# full build gate chain on the stable lock of every line with the pull
# request's build definition. Publishes nothing. The check job passes only when
# all of them pass.
name: ci

on:
  pull_request:

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      lines: ${{ steps.lines.outputs.lines }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests and shellcheck
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/ca-distrust.test.cjs
          node --test tests/ca-image-filter.test.cjs
          shellcheck scripts/*.sh

      - name: Verify current upstream root-store formats
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # No repository state is written: this validates both authoritative
          # source parsers with a disposable initial comparison baseline.
          python3 scripts/root_trust_monitor.py \
            --state-dir "$RUNNER_TEMP/root-trust-probe" \
            --report "$RUNNER_TEMP/root-trust-probe.json"

      - name: List the lines
        id: lines
        run: |
          lines=$(python3 scripts/lock.py lines)
          jq -e 'type == "array" and length > 0 and all(test("^[1-9][0-9]{0,2}$"))' <<<"$lines" > /dev/null
          echo "lines=$lines" >> "$GITHUB_OUTPUT"

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor and actionlint
        run: scripts/workflow-lint.sh

  build:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.unit.outputs.lines) }}
    env:
      LINE: ${{ matrix.line }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare a lock with this build definition
        run: |
          grep -E '^[A-Z_]+=' toolchain.env >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/work"
          cp "state/$LINE/stable.lock" "$RUNNER_TEMP/work/ci.lock"
          python3 scripts/lock.py set "$RUNNER_TEMP/work/ci.lock" \
            "BUILD_DEFINITION_SHA256=$(python3 scripts/lock.py build-definition)" PUBLISHED_DIGEST=
          python3 scripts/lock.py check "$RUNNER_TEMP/work/ci.lock" "$LINE"
          python3 scripts/upstream.py verify-node "$(python3 scripts/lock.py get "state/$LINE/stable.lock" NODE_VERSION)" \
            "$(python3 scripts/lock.py get "state/$LINE/stable.lock" NODE_SHA256)"

      - name: Install the pinned buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
          # Fetch the pinned buildx every run instead of restoring it from the
          # Actions cache, which another workflow run can write.
          cache-binary: false

      - name: Build twice in fresh builders and compare
        run: |
          KEEP_BUILDER=1 scripts/reproduce.sh "$RUNNER_TEMP/work/ci.lock" "$RUNNER_TEMP/work/out"
          scripts/load-image.sh "$RUNNER_TEMP/work/out/a/image.tar" minimal-node-runtime:build
          container=$(docker create minimal-node-runtime:build)
          docker export "$container" | tar -t > "$RUNNER_TEMP/work/listing.txt"
          docker rm "$container"

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/work/out/a/oci
          scanners: vuln
          vuln-type: os,library
          list-all-pkgs: 'true'
          format: json
          output: ${{ runner.temp }}/work/scan.json
          ignore-unfixed: false
          exit-code: '0'
          version: ${{ env.TRIVY_VERSION }}
          timeout: 10m

      - name: Gate, policy and smoke test
        run: |
          work="$RUNNER_TEMP/work"
          scripts/gate.sh "$work/scan.json" "$work/ci.lock" "$work/listing.txt"
          scripts/vuln-policy.sh "$work/scan.json" "$work/unfixed.json"
          scripts/smoke-test.sh minimal-node-runtime:build "$(python3 scripts/lock.py get "$work/ci.lock" NODE_VERSION)"
          scripts/negative-control.sh build "$work/out/a/image.tar" "$work/ci.lock" "$work/neg"

      - name: Scan the control without /etc/debian_version
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/work/neg/no-debian-version.oci
          scanners: vuln
          vuln-type: os,library
          list-all-pkgs: 'true'
          format: json
          output: ${{ runner.temp }}/work/neg/no-debian-version.json
          exit-code: '0'
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan the control with an old libc6
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/work/neg/old-libc6.oci
          scanners: vuln
          vuln-type: os,library
          list-all-pkgs: 'true'
          format: json
          output: ${{ runner.temp }}/work/neg/old-libc6.json
          exit-code: '0'
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan the control with a zlib1g entry
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/work/neg/zlib-entry.oci
          scanners: vuln
          vuln-type: os,library
          list-all-pkgs: 'true'
          format: json
          output: ${{ runner.temp }}/work/neg/zlib-entry.json
          exit-code: '0'
          version: ${{ env.TRIVY_VERSION }}

      - name: Check that every control is rejected
        run: scripts/negative-control.sh check "$RUNNER_TEMP/work/neg" "$RUNNER_TEMP/work/ci.lock"

      - name: Generate the SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/work/out/a/oci
          format: cyclonedx
          output: ${{ runner.temp }}/work/sbom.trivy.cdx.json
          exit-code: '0'
          version: ${{ env.TRIVY_VERSION }}

      - name: Merge the bundled components and check them against node
        run: |
          work="$RUNNER_TEMP/work"
          scripts/sbom-bundled.sh minimal-node-runtime:build "$work/sbom.trivy.cdx.json" "$work/ci.lock" \
            "$(cat "$work/out/digest")" "$work/sbom.cdx.json"

      - name: Prove monitored CA distrust triggers a real image rebuild
        run: |
          # A synthetic Mozilla trust withdrawal is applied only inside this
          # disposable PR checkout. Publishing and workflow dispatch are never invoked.
          bash scripts/root-trust-integration.sh minimal-node-runtime:build \
            "$RUNNER_TEMP/work/ci.lock" "$RUNNER_TEMP/work"

      - name: Remove the builders
        if: always()
        # Cleanup never fails the job: the build scripts may already have
        # removed a builder, and buildx ls can list a name more than once.
        run: |
          for name in $(docker buildx ls --format '{{.Name}}' | grep '^mnr-' | sort -u); do
            docker buildx rm --force "$name" >/dev/null 2>&1 || true
          done

  check:
    # The one status to require: unit tests, the workflow lint and every line's
    # build passed.
    needs: [unit, workflow-lint, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to pass
        env:
          UNIT: ${{ needs.unit.result }}
          LINT: ${{ needs.workflow-lint.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "unit: $UNIT, workflow-lint: $LINT, build: $BUILD"
          [ "$UNIT" = success ] && [ "$LINT" = success ] && [ "$BUILD" = success ]
