# Moves a line's stable tags (<line>, <line>-trixie) to that line's published
# candidate digest, after the candidate has been validated in a consuming
# stack. This is the only manual step in the update model.
#
# The line is the one whose state/<line>/candidate.lock names the digest. It
# checks that the digest is that current candidate, that it carries its
# keyless signature, its scan attestation, its SBOM attestation and its build
# provenance, and that it passes the gate, the vulnerability policy and the
# smoke test again. The digest itself never changes; only the tags move.
name: promote

on:
  workflow_dispatch:
    inputs:
      digest:
        description: The candidate digest to promote (sha256:...)
        required: true
        type: string

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write      # the record commit
      packages: write      # the tag move
      attestations: read
      issues: write        # close the candidate issue
    env:
      DIGEST: ${{ inputs.digest }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job pushes the promotion commit to main with the job token. The checkout
          # keeps it under $RUNNER_TEMP, and the job uploads no artifacts.
          persist-credentials: true

      - name: Check that the digest is the current candidate of a line
        run: |
          grep -E '^[A-Z_]+=' toolchain.env >> "$GITHUB_ENV"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "not a digest: $DIGEST"; exit 1; }
          line=
          for each in $(python3 scripts/lock.py lines | jq -r '.[]'); do
            [ -f "state/$each/candidate.lock" ] || continue
            if [ "$(python3 scripts/lock.py get "state/$each/candidate.lock" PUBLISHED_DIGEST)" = "$DIGEST" ]; then
              line=$each
            fi
            echo "node $each: current candidate '$(python3 scripts/lock.py get "state/$each/candidate.lock" PUBLISHED_DIGEST)'"
          done
          if [ -z "$line" ]; then
            echo "$DIGEST is not the current candidate of any line; only a current candidate is promoted"
            exit 1
          fi
          echo "LINE=$line" >> "$GITHUB_ENV"
          python3 scripts/lock.py check "state/$line/candidate.lock" "$line" || {
            echo "the build definition changed since the candidate was built; let the update run rebuild it first"
            exit 1
          }

      - name: Install the pinned buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
          # Fetch the pinned buildx every run instead of restoring it from the
          # Actions cache, which another workflow run can write.
          cache-binary: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the signature and the attestations
        run: |
          identity="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/publish\.yml@refs/heads/main$"
          for check in verify "verify-attestation --type vuln"; do
            # shellcheck disable=SC2086
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e DOCKER_CONFIG=/docker-config \
              -v "$HOME/.docker:/docker-config:ro" "$COSIGN_IMAGE" $check "$IMAGE_REPOSITORY@$DIGEST" \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done
          signer="$GITHUB_REPOSITORY/.github/workflows/publish.yml"
          gh attestation verify "oci://$IMAGE_REPOSITORY@$DIGEST" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer"
          gh attestation verify "oci://$IMAGE_REPOSITORY@$DIGEST" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer" \
            --predicate-type https://cyclonedx.org/bom

      - name: Scan the candidate again
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ inputs.digest }}
          scanners: vuln
          vuln-type: os,library
          list-all-pkgs: 'true'
          format: json
          output: ${{ runner.temp }}/scan.json
          ignore-unfixed: false
          exit-code: '0'
          version: ${{ env.TRIVY_VERSION }}
          timeout: 10m

      - name: Gate, policy and smoke test
        run: |
          scripts/gate.sh "$RUNNER_TEMP/scan.json" "state/$LINE/candidate.lock"
          scripts/vuln-policy.sh "$RUNNER_TEMP/scan.json" "$RUNNER_TEMP/unfixed.json"
          docker pull "$IMAGE_REPOSITORY@$DIGEST"
          scripts/smoke-test.sh "$IMAGE_REPOSITORY@$DIGEST" "$(python3 scripts/lock.py get "state/$LINE/candidate.lock" NODE_VERSION)"

      - name: Move the stable tags
        run: |
          docker buildx imagetools create --prefer-index=false \
            -t "$IMAGE_REPOSITORY:$LINE" -t "$IMAGE_REPOSITORY:$LINE-trixie" "$IMAGE_REPOSITORY@$DIGEST"
          for tag in "$LINE" "$LINE-trixie"; do
            resolved=$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            [ "$resolved" = "$DIGEST" ] || { echo "$tag resolves to $resolved"; exit 1; }
          done

      - name: Record the promotion
        run: |
          cp "state/$LINE/candidate.lock" "state/$LINE/stable.lock"
          cp "state/$LINE/candidate.rootfs" "state/$LINE/stable.rootfs"
          python3 scripts/lock.py set "state/$LINE/stable.lock" CHANNEL=stable BREAKING_PACKAGES=
          tag=$(python3 scripts/lock.py get "state/$LINE/stable.lock" PUBLISHED_TAG)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "state/$LINE/"
          git commit -q -m "Promote $tag to node $LINE stable" -m "Digest: $DIGEST" -m "Evidence: $RUN_URL"
          for attempt in 1 2 3; do
            git push origin HEAD:main && break
            [ "$attempt" = 3 ] && exit 1
            git pull --rebase origin main
          done
          scripts/issue.sh close candidate "Candidate $tag awaits validation" "Promoted to stable by $RUN_URL"
