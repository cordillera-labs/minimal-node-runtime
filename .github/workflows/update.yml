# The hourly run. It updates every line: each Node.js major with a stable lock
# in state/<line>/ (scripts/lock.py lines). The lines run in parallel through
# line.yml, which plans, publishes, records and reports one line; a failure in
# one line never stops another.
#
#   lines      list the lines from state/.
#   line       line.yml, once per line.
#   toolchain  compare pins with cooldown-eligible upstream releases, report
#              issues, and advance one pin-only routine PR through full CI.
#              This is independent of the line publication jobs.
#   keepalive  commit a heartbeat when main has been quiet.
#
# Events made with GITHUB_TOKEN start no workflow runs, so nothing here relies
# on the record commits triggering anything.
name: update
run-name: ${{ inputs.distrust_run_id && format('CA distrust {0}', inputs.distrust_run_id) || 'Update' }}

on:
  schedule:
    # Minute 17: GitHub documents the start of the hour as its peak load.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      distrust_run_id:
        description: Optional production root-trust run to correlate publication.
        type: string
        required: false

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  lines:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lines: ${{ steps.lines.outputs.lines }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the lines
        id: lines
        run: |
          lines=$(python3 scripts/lock.py lines)
          jq -e 'type == "array" and length > 0 and all(test("^[1-9][0-9]{0,2}$"))' <<<"$lines" > /dev/null
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "lines: $lines"

  line:
    needs: lines
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.lines.outputs.lines) }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      issues: write
    # A job-level call resolves ./ from the calling commit, not the runner
    # filesystem. actionlint 1.7.12 rejects the $/ form zizmor suggests.
    uses: ./.github/workflows/line.yml # zizmor: ignore[self-repository]
    with:
      line: ${{ matrix.line }}

  toolchain:
    # Dependabot does not read toolchain.env. Report every eligible pin, then
    # advance at most one bot PR. The security fast path has priority and uses
    # the same concurrency group; normal publishing remains independent.
    # Lookup faults never authorize pin changes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: toolchain-security
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] push trusted pin-only PR branches

      - name: Compare the pins with upstream
        id: check
        run: python3 scripts/toolchain.py check --out "$RUNNER_TEMP/toolchain.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the issue of each tool
        run: |
          label=$(jq -r .label "$RUNNER_TEMP/toolchain.json")
          jq -c '.tools[]' "$RUNNER_TEMP/toolchain.json" | while read -r tool; do
            state=$(jq -r .state <<<"$tool")
            title=$(jq -r .title <<<"$tool")
            case "$state" in
              update)
                body=$(mktemp)
                jq -r .body <<<"$tool" > "$body"
                echo "Run: $RUN_URL" >> "$body"
                scripts/issue.sh ensure "$label" "$title" "$body"
                ;;
              current|pending)
                scripts/issue.sh close "$label" "$title" "The pin reached the eligible release ($RUN_URL)."
                ;;
              *)
                echo "$title: not changed, the lookup faulted"
                ;;
            esac
          done

      - name: Advance routine toolchain PRs after the release cooldown
        run: bash scripts/toolchain-routine.sh "$RUNNER_TEMP/toolchain.json"

  keepalive:
    # The record commits keep the scheduled workflows active (GitHub disables
    # them in a public repository after 60 days without repository activity).
    # When no input of any line has changed for KEEPALIVE_DAYS, this commits a
    # heartbeat.
    needs: [lines, line]
    if: always() && needs.lines.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      KEEPALIVE_DAYS: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main as it is now, with any record commit this run made.
          ref: main
          fetch-depth: 1
          # This job pushes the heartbeat commit to main with the job token.
          # The checkout keeps it under $RUNNER_TEMP, and the job uploads no
          # artifacts.
          persist-credentials: true

      - name: Commit a heartbeat when main has been quiet
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ($(date +%s) - last) / 86400 ))
          echo "the last commit on main is $age_days days old"
          if [ "$age_days" -lt "$KEEPALIVE_DAYS" ]; then
            exit 0
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ > state/heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/heartbeat
          git commit -q -m "Record a heartbeat: no input changed for $age_days days"
          git push origin HEAD:main
