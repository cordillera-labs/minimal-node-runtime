# Weekly: rebuild each published lock of every line from scratch, at the
# commit that built it, in two fresh builders, and compare with the published
# digest. A mismatch opens an issue.
name: reproduce

on:
  # Exercise historical publication replay in read-only mode when this
  # workflow or its replay implementation changes. No issue writes on PRs.
  pull_request:
    paths:
      - '.github/workflows/reproduce.yml'
      - 'scripts/reproduce.sh'
      - 'scripts/lock.py'
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      locks: ${{ steps.locks.outputs.locks }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the locks of every line
        id: locks
        run: |
          locks=$(python3 scripts/lock.py lines \
            | jq -c '[.[] | {line: ., channel: ("stable", "candidate")}]')
          echo "locks=$locks" >> "$GITHUB_OUTPUT"
          echo "locks: $locks"

  reproduce:
    needs: locks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lock: ${{ fromJSON(needs.locks.outputs.locks) }}
    name: reproduce (${{ matrix.lock.line }} ${{ matrix.lock.channel }})
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the published lock
        id: lock
        env:
          LINE: ${{ matrix.lock.line }}
          CHANNEL: ${{ matrix.lock.channel }}
        run: |
          [[ "$LINE" =~ ^[1-9][0-9]{0,2}$ ]] || { echo "invalid line $LINE"; exit 1; }
          case "$CHANNEL" in stable | candidate) ;; *) echo "invalid channel $CHANNEL"; exit 1 ;; esac
          lock="state/$LINE/$CHANNEL.lock"
          if [ ! -f "$lock" ] || [ -z "$(python3 scripts/lock.py get "$lock" PUBLISHED_DIGEST)" ]; then
            echo "no published node $LINE $CHANNEL digest"
            exit 0
          fi
          cp "$lock" "$RUNNER_TEMP/published.lock"
          commit=$(python3 scripts/lock.py get "$lock" PUBLISHED_COMMIT)
          # The buildx CLI, not just BuildKit, must match the historical build.
          # Do not accidentally use a newer pin from the workflow's main checkout.
          git show "$commit:toolchain.env" | grep -E '^[A-Z_]+=' >> "$GITHUB_ENV"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$(python3 scripts/lock.py get "$lock" PUBLISHED_TAG)" >> "$GITHUB_OUTPUT"

      - name: Install the pinned buildx
        if: steps.lock.outputs.commit != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
          # Fetch the pinned buildx every run instead of restoring it from the
          # Actions cache, which another workflow run can write.
          cache-binary: false

      - name: Rebuild at the publishing commit and compare
        if: steps.lock.outputs.commit != ''
        env:
          COMMIT: ${{ steps.lock.outputs.commit }}
          TAG: ${{ steps.lock.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Reproduce the *historical published inputs*, not newer channel
          # metadata. A later non-byte-changing toolchain/build-definition
          # acceptance may update the channel lock without republishing the
          # digest or changing its original PUBLISHED_COMMIT.
          published=$(python3 scripts/lock.py get "$RUNNER_TEMP/published.lock" PUBLISHED_DIGEST)
          mkdir -p "$RUNNER_TEMP/release-inputs" "$RUNNER_TEMP/release-debs"
          gh release download "$TAG" --pattern 'inputs.lock' --dir "$RUNNER_TEMP/release-inputs"
          # The .deb assets come first; missing assets fall back to the pinned
          # snapshot URL and the immutable SHA-256 still decides acceptance.
          gh release download "$TAG" --pattern '*.deb' --dir "$RUNNER_TEMP/release-debs" \
            || echo "the release $TAG has no .deb assets; snapshot.debian.org serves them"
          release_commit=$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)
          [ "$release_commit" = "$COMMIT" ] || { echo "release $TAG targets $release_commit, recorded commit is $COMMIT"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/source" "$COMMIT"
          cd "$RUNNER_TEMP/source"
          release_lock="$RUNNER_TEMP/release-inputs/inputs.lock"
          actual_tag=$(python3 scripts/lock.py tag "$release_lock")
          [ "$actual_tag" = "$TAG" ] || { echo "release inputs produce tag $actual_tag, expected $TAG"; exit 1; }
          # The release asset predates the publication record; attach the
          # current recorded digest solely as a post-build comparison.
          python3 scripts/lock.py set "$release_lock" "PUBLISHED_DIGEST=$published"
          DEBS_FROM="$RUNNER_TEMP/release-debs" scripts/reproduce.sh "$release_lock" "$RUNNER_TEMP/out"
          registry=$(docker buildx imagetools inspect "$IMAGE_REPOSITORY@$published" --format '{{json .Manifest}}' | jq -r .digest)
          [ "$registry" = "$published" ] || { echo "the registry does not serve $published"; exit 1; }

  report:
    needs: reproduce
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULT: ${{ needs.reproduce.result }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or close the reproducibility issue
        run: |
          title="Published digest did not reproduce"
          if [ "$RESULT" = failure ]; then
            body=$(mktemp)
            {
              echo "The weekly rebuild of a published lock gave a different digest, or the"
              echo "registry did not serve the published digest."
              echo
              echo "Run: $RUN_URL"
              echo
              echo "Until this is resolved, the claim that every digest reproduces from its lock does not hold."
            } > "$body"
            scripts/issue.sh ensure reproducibility "$title" "$body"
          elif [ "$RESULT" = success ]; then
            scripts/issue.sh close reproducibility "$title" "Reproduced by $RUN_URL"
          fi
